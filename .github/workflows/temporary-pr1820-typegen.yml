name: Temporary PR1820 Supabase Typegen

on:
  push:
    branches:
      - ops/acquisition-funnel-view
    paths:
      - .github/workflows/temporary-pr1820-typegen.yml

permissions:
  contents: write

jobs:
  typegen:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ops/acquisition-funnel-view
          fetch-depth: 0

      - name: Apply clean-replay generated contract diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("features/shared/types/types/supabase.ts")
          text = path.read_text()
          block = '''      get_ops_marketing_funnel_snapshot: {\n        Args: { p_breakdown_limit: number; p_since: string }\n        Returns: Json\n      }\n'''
          if block in text:
              raise SystemExit(0)

          marker = '''      get_ops_ai_usage_snapshot: {\n        Args: { p_event_limit?: number; p_since?: string }\n        Returns: Json\n      }\n'''
          if marker not in text:
              raise SystemExit("Expected generated type marker not found")

          path.write_text(text.replace(marker, marker + block, 1))
          PY

      - name: Commit verified generated contract
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- features/shared/types/types/supabase.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/shared/types/types/supabase.ts
          git commit -m "Refresh Supabase types for Ops funnel snapshot"
          git push origin HEAD:ops/acquisition-funnel-view
