name: Temporary PR1820 Supabase Typegen

on:
  push:
    branches:
      - ops/acquisition-funnel-view
    paths:
      - supabase/migrations/20261007183500_ops_marketing_funnel_snapshot.sql
      - .github/workflows/temporary-pr1820-typegen.yml

permissions:
  contents: write

jobs:
  typegen:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ops/acquisition-funnel-view
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.114.0

      - name: Generate local public schema types
        shell: bash
        run: |
          set -euo pipefail
          supabase db start
          trap 'supabase stop --no-backup || true' EXIT
          supabase db reset --local --no-seed
          supabase gen types typescript --local --schema public > features/shared/types/types/supabase.ts

      - name: Commit generated contract
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- features/shared/types/types/supabase.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/shared/types/types/supabase.ts
          git commit -m "Refresh Supabase types for Ops funnel snapshot"
          git push origin HEAD:ops/acquisition-funnel-view
