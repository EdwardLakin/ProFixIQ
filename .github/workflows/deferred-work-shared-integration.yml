name: Deferred Work Shared Integration

on:
  pull_request:
    paths:
      - "supabase/migrations/20260909163000_carry_forward_deferred_work.sql"
      - "supabase/migrations/20260909163100_guard_deferred_carry_forward_sources.sql"
      - "supabase/migrations/20260909163200_harden_deferred_work_shared_integration.sql"
      - "tests/security/deferred-work-shared-integration.runtime.sql"
      - ".github/workflows/deferred-work-shared-integration.yml"

permissions:
  contents: read

concurrency:
  group: deferred-work-shared-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.114.0
          github-token: ${{ github.token }}

      - name: Initialize ephemeral Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f supabase/config.toml ]]; then
            supabase init
          fi
          supabase --version

      - name: Start fresh database and apply migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db start 2>&1 | tee deferred-work-db-start.log

      - name: Execute deferred-work shared integration
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 \
            -f tests/security/deferred-work-shared-integration.runtime.sql \
            2>&1 | tee deferred-work-shared-integration-runtime.log

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: supabase stop --no-backup || true
