name: Temporary Lifecycle Review Repair

on:
  push:
    branches:
      - analytics/lifecycle-conversion-funnel
    paths:
      - .github/workflows/temporary-lifecycle-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: analytics/lifecycle-conversion-funnel
          fetch-depth: 0

      - name: Apply lifecycle review repair
        run: python .github/scripts/repair_lifecycle_conversion.py

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20261007204500_marketing_lifecycle_conversion.sql \
            features/analytics/server/lifecycle-conversion.ts \
            features/stripe/api/stripe/checkout/link-user/route.ts \
            features/onboarding-v2/guided/server.ts \
            features/onboarding-v2/guided/instantAnalysisHandoff.ts \
            tests/marketing-lifecycle-conversion.test.ts \
            tests/security/marketing-lifecycle-conversion.runtime.sql \
            .github/workflows/supabase-clean-replay-audit.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: address lifecycle conversion review"
          git push origin HEAD:analytics/lifecycle-conversion-funnel
