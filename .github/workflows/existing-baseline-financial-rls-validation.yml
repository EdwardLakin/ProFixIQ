name: Existing-baseline Financial RLS Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20260914013000_harden_existing_baseline_financial_rls.sql"
      - "tests/security/existing-baseline-financial-rls.runtime.sql"
      - ".github/workflows/existing-baseline-financial-rls-validation.yml"

permissions:
  contents: read

concurrency:
  group: existing-baseline-financial-rls-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.114.0
          github-token: ${{ github.token }}
      - name: Start clean local database
        run: supabase db start
      - name: Existing-baseline financial RLS runtime
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: >-
          psql "$DB_URL" -X -v ON_ERROR_STOP=1
          -f tests/security/existing-baseline-financial-rls.runtime.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
