name: Workspace Switcher Repair

on:
  push:
    branches:
      - feature/workspace-product-switcher

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/workspace-product-switcher
          fetch-depth: 0

      - name: Apply switcher patches
        shell: bash
        run: python scripts/patch-workspace-product-switcher.py

      - name: Regenerate API route inventory
        shell: bash
        run: node scripts/audit-api-routes.mjs

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/workspace-switcher-repair.yml
          rm scripts/patch-workspace-product-switcher.py
          git add \
            .github/workflows/workspace-switcher-repair.yml \
            scripts/patch-workspace-product-switcher.py \
            features/shared/components/AppShell.tsx \
            features/mobile/service/FieldWorkspaceShell.tsx \
            features/fleet/components/FleetProductShell.tsx \
            docs/audits/api-route-boundary-inventory.json \
            docs/audits/api-route-boundary-inventory.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wire product switcher across workspaces"
          git push origin HEAD:feature/workspace-product-switcher
