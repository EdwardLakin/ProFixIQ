name: Sync Mobile Dispatch Types

on:
  push:
    branches:
      - agent/mobile-dispatch-operations

permissions:
  contents: write
  actions: read

concurrency:
  group: sync-mobile-dispatch-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out generated-types path
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-dispatch-operations
          fetch-depth: 0
          sparse-checkout: |
            features/shared/types/types
          sparse-checkout-cone-mode: true

      - name: Download exact dispatch ownership clean-replay types
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dispatch-types"
          gh run download 31423844562 \
            --repo EdwardLakin/ProFixIQ \
            --name supabase-clean-replay-31423844562 \
            --dir "$RUNNER_TEMP/dispatch-types"

      - name: Commit exact generated types
        shell: bash
        run: |
          set -euo pipefail
          GENERATED="$(find "$RUNNER_TEMP/dispatch-types" -name generated-supabase-types.ts -print -quit)"
          if [[ -z "$GENERATED" || ! -f "$GENERATED" ]]; then
            echo "generated-supabase-types.ts was not found"
            exit 1
          fi
          cp "$GENERATED" features/shared/types/types/supabase.ts
          if git diff --quiet -- features/shared/types/types/supabase.ts; then
            echo "Generated types already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/shared/types/types/supabase.ts
          git commit -m "Regenerate Supabase types for dispatch ownership"
          git push origin HEAD:agent/mobile-dispatch-operations
