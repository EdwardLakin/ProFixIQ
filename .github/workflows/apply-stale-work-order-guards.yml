name: Apply Stale Work Order Guards

on:
  push:
    branches:
      - repair/codex-review-followups-1302-1316
    paths:
      - scripts/apply_stale_work_order_mutation_guards.py
      - .github/workflows/apply-stale-work-order-guards.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/codex-review-followups-1302-1316
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply mutation-time stale draft guards
        run: python scripts/apply_stale_work_order_mutation_guards.py
      - name: Commit generated guards
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: revalidate create-page work orders at mutation time"
          git push origin HEAD:repair/codex-review-followups-1302-1316
      - name: Validate stale-work-order surface
        run: |
          pnpm exec tsc --noEmit
          pnpm exec eslint \
            features/work-orders/lib/client/validateMutableWorkOrder.ts \
            features/work-orders/app/work-orders/create/page.tsx \
            features/work-orders/components/NewWorkOrderLineForm.tsx \
            features/work-orders/components/MenuQuickAdd.tsx \
            tests/codex-review-followup-hardening.test.ts
          pnpm exec vitest run \
            tests/codex-review-followup-hardening.test.ts \
            tests/stale-create-work-order-validation.test.ts \
            tests/work-orders/create-work-order-fast-intake-redesign.test.ts
