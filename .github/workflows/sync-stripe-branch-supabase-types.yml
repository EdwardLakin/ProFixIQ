name: Sync Stripe Branch Supabase Types

on:
  push:
    branches:
      - codex/stripe-billing-model-connect-correction
    paths:
      - ".github/workflows/sync-stripe-branch-supabase-types.yml"
      - "supabase/migrations/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/stripe-billing-model-connect-correction
          fetch-depth: 0
      - uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}
      - name: Initialize local Supabase
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f supabase/config.toml ]]; then
            supabase init
          fi
      - name: Generate committed types from a clean replay
        shell: bash
        run: |
          set -euo pipefail
          supabase db start
          supabase db reset --local --no-seed
          supabase gen types typescript --local --schema public \
            > features/shared/types/types/supabase.ts
      - name: Commit generated types
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- features/shared/types/types/supabase.ts; then
            echo "Supabase types are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/shared/types/types/supabase.ts
          git commit -m "Synchronize generated Supabase types"
          git push origin HEAD:codex/stripe-billing-model-connect-correction
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
