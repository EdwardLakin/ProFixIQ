name: Harden Alternate User Provisioning

on:
  push:
    branches:
      - repair/codex-review-followups-1302-1316
    paths:
      - scripts/harden_alternate_user_provisioning.py
      - .github/workflows/harden-alternate-user-provisioning.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/codex-review-followups-1302-1316
          fetch-depth: 1
      - run: python scripts/harden_alternate_user_provisioning.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: harden alternate staff provisioning and role rollback"
          git push origin HEAD:repair/codex-review-followups-1302-1316
