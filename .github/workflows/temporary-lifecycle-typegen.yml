name: Temporary Lifecycle Typegen

on:
  push:
    branches: [analytics/lifecycle-conversion-funnel]

permissions:
  contents: write

jobs:
  typegen:
    if: ${{ !contains(github.event.head_commit.message, 'refresh lifecycle Supabase contract') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out lifecycle branch
        uses: actions/checkout@v4
        with:
          ref: analytics/lifecycle-conversion-funnel
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.114.0
          github-token: ${{ github.token }}

      - name: Generate repository-native public schema contract
        shell: bash
        run: |
          set -euo pipefail
          supabase db start
          bash scripts/verify-supabase-generated-types.sh --write
          cp features/shared/types/types/supabase.ts /tmp/supabase.ts

      - name: Rebase generated contract onto latest branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin analytics/lifecycle-conversion-funnel
          git reset --hard origin/analytics/lifecycle-conversion-funnel
          cp /tmp/supabase.ts features/shared/types/types/supabase.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/shared/types/types/supabase.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh lifecycle Supabase contract"
          git push origin HEAD:analytics/lifecycle-conversion-funnel

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
