name: PR1404 Generated Types Sync

on:
  push:
    branches:
      - agent/mobile-v1-productization

permissions:
  actions: read
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4

      - name: Restore generated Supabase types from clean replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/pr1404-generated-types"
          mkdir -p "$artifact_dir"
          gh run download 31455910655 \
            --repo "$GITHUB_REPOSITORY" \
            --name supabase-clean-replay-31455910655 \
            --dir "$artifact_dir"
          test -s "$artifact_dir/generated-supabase-types.ts"
          cp "$artifact_dir/generated-supabase-types.ts" \
            features/shared/types/types/supabase.ts

      - name: Commit exact generated contract
        run: |
          set -euo pipefail
          if git diff --quiet -- features/shared/types/types/supabase.ts; then
            echo "Generated Supabase types are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/shared/types/types/supabase.ts
          git commit -m "chore(db): refresh generated Supabase types"
          git push origin "HEAD:${GITHUB_REF_NAME}"
