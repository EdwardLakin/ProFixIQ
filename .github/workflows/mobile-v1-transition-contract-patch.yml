name: Mobile V1 Transition Contract Patch

on:
  push:
    branches:
      - agent/mobile-v1-productization
    paths:
      - ".github/workflows/mobile-v1-transition-contract-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-v1-productization
          fetch-depth: 1

      - name: Preserve transition contract with dependency chaining
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("features/mobile/service/MobileServiceShell.tsx")
          text = path.read_text()

          old = '''async function transitionVisit(\n  visit: DispatchVisit,\n  toStatus: ServiceVisitStatus,\n  dependsOn: string[] = [],\n): Promise<TransitionOutcome> {\n  const mutationId = operationKey(visit.id, toStatus);\n  const serverState: { result: DispatchMutationResult | null } = { result: null };\n  const payload = {'''
          new = '''async function transitionVisit(\n  visit: DispatchVisit,\n  toStatus: ServiceVisitStatus,\n  dependsOn?: string[],\n): Promise<TransitionOutcome> {\n  const mutationId = operationKey(visit.id, toStatus);\n  const serverState: { result: DispatchMutationResult | null } = { result: null };\n\n  let resolvedDependencies = dependsOn;\n  if (resolvedDependencies === undefined) {\n    await hydrateOfflineMutationQueue();\n    const orderKey = `service-visit:${visit.id}`;\n    const previous = listPendingMutations()\n      .filter(\n        (mutation) =>\n          mutation.actionType === "service-visit:transition" &&\n          mutation.orderKey === orderKey,\n      )\n      .sort(\n        (a, b) =>\n          new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime(),\n      )\n      .at(-1);\n    resolvedDependencies = previous ? [previous.clientMutationId] : [];\n  }\n\n  const payload = {'''
          if old not in text:
              raise SystemExit("transitionVisit signature block not found")
          text = text.replace(old, new, 1)

          old = '''    dependsOn: dependsOn.length ? dependsOn : undefined,\n    orderKey: `service-visit:${visit.id}`,'''
          new = '''    dependsOn:\n      resolvedDependencies.length > 0 ? resolvedDependencies : undefined,\n    orderKey: `service-visit:${visit.id}`,'''
          if old not in text:
              raise SystemExit("transitionVisit dependency block not found")
          text = text.replace(old, new, 1)

          old = '''        let current = visit;\n        await hydrateOfflineMutationQueue();\n        const orderKey = `service-visit:${visit.id}`;\n        const previous = listPendingMutations()\n          .filter(\n            (mutation) =>\n              mutation.actionType === "service-visit:transition" &&\n              mutation.orderKey === orderKey,\n          )\n          .sort(\n            (a, b) =>\n              new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime(),\n          )\n          .at(-1);\n        let dependencies = previous ? [previous.clientMutationId] : [];\n        let queued = false;\n\n        if (toStatus === "en_route" && current.status === "scheduled") {\n          const dispatch = await transitionVisit(\n            current,\n            "dispatched",\n            dependencies,\n          );\n          current = dispatch.visit;\n          dependencies = [dispatch.mutationId];\n          queued ||= dispatch.queued;\n          applyVisit(current);\n        }\n\n        const result = await transitionVisit(current, toStatus, dependencies);'''
          new = '''        let current = visit;\n        let queued = false;\n        let result: TransitionOutcome;\n\n        if (toStatus === "en_route" && current.status === "scheduled") {\n          const dispatch = await transitionVisit(current, "dispatched");\n          current = dispatch.visit;\n          queued ||= dispatch.queued;\n          applyVisit(current);\n          result = await transitionVisit(current, toStatus, [dispatch.mutationId]);\n        } else {\n          result = await transitionVisit(current, toStatus);\n        }'''
          if old not in text:
              raise SystemExit("runTransition dependency block not found")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          grep -F 'transitionVisit(current, "dispatched")' features/mobile/service/MobileServiceShell.tsx

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add features/mobile/service/MobileServiceShell.tsx
          git commit -m "Preserve Mobile transition contract with queued dependencies"
          git push origin HEAD:agent/mobile-v1-productization
