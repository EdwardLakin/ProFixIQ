name: Sync Codex Follow-up Generated Types

on:
  push:
    branches:
      - repair/codex-review-followups-1302-1316
    paths:
      - scripts/sync_codex_followup_generated_types.py
      - .github/workflows/sync-codex-followup-generated-types.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/codex-review-followups-1302-1316
          fetch-depth: 1
      - run: python scripts/sync_codex_followup_generated_types.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: sync Supabase types for Codex follow-up migration"
          git push origin HEAD:repair/codex-review-followups-1302-1316
