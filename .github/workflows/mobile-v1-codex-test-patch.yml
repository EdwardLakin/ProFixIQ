name: Mobile V1 Codex Test Patch

on:
  push:
    branches:
      - agent/mobile-v1-productization
    paths:
      - ".github/workflows/mobile-v1-codex-test-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-v1-productization
          fetch-depth: 1
      - name: Fix runtime assertion block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/mobile/mobile-v1-codex-hardening.runtime.sql")
          text = path.read_text()
          old = '''delete from public.profiles\nwhere id = '9a300000-0000-4000-8000-000000000002';\n\nif exists (\n  select 1 from public.profiles\n  where id = '9a300000-0000-4000-8000-000000000002'\n) then\n  raise exception 'Mobile V1 hardening failed: profile cascade delete rolled back';\nend if;'''
          new = '''do $$\nbegin\n  delete from public.profiles\n  where id = '9a300000-0000-4000-8000-000000000002';\n\n  if exists (\n    select 1 from public.profiles\n    where id = '9a300000-0000-4000-8000-000000000002'\n  ) then\n    raise exception 'Mobile V1 hardening failed: profile cascade delete rolled back';\n  end if;\nend;\n$$;'''
          if old not in text:
              raise SystemExit("Cascade assertion block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add tests/mobile/mobile-v1-codex-hardening.runtime.sql
          git commit -m "Fix Mobile V1 adversarial runtime syntax"
          git push origin HEAD:agent/mobile-v1-productization
