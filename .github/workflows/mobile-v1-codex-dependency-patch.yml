name: Mobile V1 Codex Dependency Patch

on:
  push:
    branches:
      - agent/mobile-v1-productization
    paths:
      - ".github/workflows/mobile-v1-codex-dependency-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-v1-productization
          fetch-depth: 1

      - name: Patch dependency semantics and intake redirect
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          mutations = Path("features/shared/lib/offline/mutations.ts")
          text = mutations.read_text()
          old = '''  const queueEntry = (status: OfflineMutationStatus = "queued") =>\n    enqueueMutation({\n      clientMutationId: args.clientMutationId,\n      actionType: args.actionType,\n      payload: args.payload,\n      userId: scope.userId,\n      shopId: scope.shopId,\n      dependsOn: args.dependsOn,\n      orderKey: args.orderKey,\n      status,\n    });\n\n  if (queueOnOffline && !navigator.onLine) {\n    await queueEntry();\n    return { queued: true, conflicted: false };\n  }'''
          new = '''  const queueEntry = (status: OfflineMutationStatus = "queued") =>\n    enqueueMutation({\n      clientMutationId: args.clientMutationId,\n      actionType: args.actionType,\n      payload: args.payload,\n      userId: scope.userId,\n      shopId: scope.shopId,\n      dependsOn: args.dependsOn,\n      orderKey: args.orderKey,\n      status,\n    });\n\n  const dependencyPending =\n    args.dependsOn?.some((id) => {\n      const dependency = queueCache.find(\n        (item) => item.clientMutationId === id && scopeMatches(item, scope),\n      );\n      return Boolean(dependency && dependency.status !== "synced");\n    }) ?? false;\n\n  // A dependent command cannot bypass an earlier queued command merely because\n  // connectivity returned between taps. Keep it queued until replay has synced\n  // every predecessor in the chain.\n  if (dependencyPending) {\n    await queueEntry();\n    return { queued: true, conflicted: false };\n  }\n\n  if (queueOnOffline && !navigator.onLine) {\n    await queueEntry();\n    return { queued: true, conflicted: false };\n  }'''
          if old not in text:
              raise SystemExit("Offline dependency insertion point not found")
          mutations.write_text(text.replace(old, new, 1))

          intake = Path("features/mobile/service/RapidServiceIntake.tsx")
          text = intake.read_text()
          old = '''      router.replace(\n        `/mobile/service?created=1&visitId=${encodeURIComponent(body.serviceVisitId)}`,\n      );'''
          new = '''      router.replace(\n        `/mobile/service/call/${encodeURIComponent(body.serviceVisitId)}`,\n      );'''
          if old not in text:
              raise SystemExit("Rapid intake handoff redirect not found")
          intake.write_text(text.replace(old, new, 1))
          PY

          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add features/shared/lib/offline/mutations.ts features/mobile/service/RapidServiceIntake.tsx
          git commit -m "Chain offline dependencies and preserve intake handoff"
          git push origin HEAD:agent/mobile-v1-productization
