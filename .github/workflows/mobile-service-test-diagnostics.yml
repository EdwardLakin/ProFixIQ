name: Mobile Service Test Diagnostics

on:
  push:
    branches:
      - agent/mobile-service-shell

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture complete Vitest output
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee "$RUNNER_TEMP/vitest.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/vitest.exit"
          exit "$status"
      - name: Upload Vitest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-service-vitest-diagnostics
          path: |
            ${{ runner.temp }}/vitest.log
            ${{ runner.temp }}/vitest.exit
          if-no-files-found: error
