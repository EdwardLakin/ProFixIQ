name: Apply PR 1404 production migrations

on:
  push:
    branches:
      - agent/mobile-v1-productization
    paths:
      - .github/workflows/apply-pr-1404-migrations.yml

permissions:
  contents: read

concurrency:
  group: apply-pr-1404-production-migrations
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: scjjkmuwadwkaaqjoigx
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout PR 1404 branch
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0

      - name: Build direct production database URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          encoded_password="$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))
          PY
          )"
          database_url="postgresql://postgres:${encoded_password}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require"
          echo "::add-mask::$database_url"
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"

      - name: Show repository migrations after current production baseline
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sort \
            | awk '$0 > "20260810166000_"'

      - name: Dry-run exact pending migration plan
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$DATABASE_URL" --include-all --dry-run 2>&1 | tee /tmp/pr1404-dry-run.log
          echo "--- planned migration filenames ---"
          grep -oE '[0-9]{14}_[A-Za-z0-9_]+\.sql' /tmp/pr1404-dry-run.log | sort -u || true
