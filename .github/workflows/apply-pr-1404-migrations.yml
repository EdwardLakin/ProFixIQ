name: Apply PR 1404 production migrations

on:
  push:
    branches:
      - agent/mobile-v1-productization
    paths:
      - .github/workflows/apply-pr-1404-migrations.yml

permissions:
  contents: read

concurrency:
  group: apply-pr-1404-production-migrations
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: scjjkmuwadwkaaqjoigx
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout PR 1404 branch
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0

      - name: Login to Supabase
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Link exact production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF"

      - name: Show linked migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked

      - name: Dry-run exact pending migration plan
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run 2>&1 | tee /tmp/pr1404-dry-run.log
          echo "--- planned migration filenames ---"
          grep -oE '[0-9]{14}_[A-Za-z0-9_]+\.sql' /tmp/pr1404-dry-run.log | sort -u || true
