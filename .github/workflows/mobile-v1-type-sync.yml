name: Mobile V1 Type Sync

on:
  push:
    branches:
      - agent/mobile-v1-productization
    paths:
      - ".github/workflows/mobile-v1-type-sync.yml"

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-v1-productization
          fetch-depth: 1

      - name: Download exact clean-replay generated types
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-v1-types"
          gh run download 31442240004 \
            --repo "$GITHUB_REPOSITORY" \
            -n supabase-clean-replay-31442240004 \
            --dir "$RUNNER_TEMP/mobile-v1-types"
          generated="$(find "$RUNNER_TEMP/mobile-v1-types" -name generated-supabase-types.ts -print -quit)"
          test -n "$generated"
          cp "$generated" features/shared/types/types/supabase.ts

      - name: Commit exact generated contract if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- features/shared/types/types/supabase.ts; then
            echo "Generated types already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/shared/types/types/supabase.ts
          git commit -m "Sync Mobile V1 generated Supabase types"
          git push origin HEAD:agent/mobile-v1-productization
