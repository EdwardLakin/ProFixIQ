name: Early Access Contract Refresh

on:
  push:
    branches:
      - feat/early-access-intake
    paths:
      - .github/workflows/early-access-contract-refresh.yml

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/early-access-intake
          fetch-depth: 0

      - name: Restore generated Supabase contract from clean-replay diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/supabase-contract"
          gh run download 37567678454 \
            --repo "$GITHUB_REPOSITORY" \
            --name supabase-clean-replay-37567678454 \
            --dir "$RUNNER_TEMP/supabase-contract"
          test -s "$RUNNER_TEMP/supabase-contract/generated-supabase-types.ts"
          cp "$RUNNER_TEMP/supabase-contract/generated-supabase-types.ts" features/shared/types/types/supabase.ts

      - name: Refresh API route boundary inventory
        run: node scripts/audit-api-routes.mjs

      - name: Remove temporary refresh workflow
        run: rm .github/workflows/early-access-contract-refresh.yml

      - name: Commit refreshed contracts and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/shared/types/types/supabase.ts docs/audits/api-route-boundary-inventory.json docs/audits/api-route-boundary-inventory.md .github/workflows/early-access-contract-refresh.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Early Access generated contracts"
          git push origin HEAD:feat/early-access-intake
