name: Sync Universal Scheduler Types

on:
  push:
    branches:
      - feature/mobile-service-foundation

permissions:
  contents: write

concurrency:
  group: scheduler-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-service-foundation
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start clean local database
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f supabase/config.toml ]]; then
            supabase init
          fi
          supabase db start

      - name: Regenerate committed database types
        shell: bash
        run: |
          set -euo pipefail
          supabase gen types typescript --local > features/shared/types/types/supabase.ts

      - name: Commit generated type drift
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- features/shared/types/types/supabase.ts; then
            echo "Generated types already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/shared/types/types/supabase.ts
          git commit -m "Regenerate Supabase types for universal scheduler"
          git push origin HEAD:feature/mobile-service-foundation

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: supabase db stop --no-backup || true
