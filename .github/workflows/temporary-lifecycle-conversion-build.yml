name: Temporary Lifecycle Conversion Build

on:
  push:
    branches:
      - analytics/lifecycle-conversion-funnel
    paths:
      - .github/workflows/temporary-lifecycle-conversion-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out lifecycle branch
        uses: actions/checkout@v4
        with:
          ref: analytics/lifecycle-conversion-funnel
          fetch-depth: 0

      - name: Apply lifecycle UI and reader patch
        run: python .github/scripts/temporary_lifecycle_conversion_build.py

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.114.0

      - name: Refresh generated public schema contract
        shell: bash
        run: |
          set -euo pipefail
          supabase db start
          trap 'supabase stop --no-backup || true' EXIT
          supabase db reset --local --no-seed
          supabase gen types typescript --local --schema public > features/shared/types/types/supabase.ts

      - name: Commit lifecycle implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            features/ops/server/get-marketing-funnel.ts \
            features/ops/components/OpsMarketingFunnel.tsx \
            features/shared/types/types/supabase.ts \
            tests/ops-marketing-funnel.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wire lifecycle conversion into Ops funnel"
          git push origin HEAD:analytics/lifecycle-conversion-funnel
