      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.114.0

      - name: Refresh generated public schema contract
        shell: bash
        run: |
          set -euo pipefail
          supabase db start
          trap 'supabase stop --no-backup || true' EXIT
          supabase db reset --local --no-seed
          supabase gen types typescript --local --schema public > features/shared/types/types/supabase.ts

      - name: Commit lifecycle implementation
