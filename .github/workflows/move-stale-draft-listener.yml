name: Move Stale Draft Listener

on:
  push:
    branches:
      - repair/codex-review-followups-1302-1316
    paths:
      - scripts/move_stale_draft_listener.py
      - .github/workflows/move-stale-draft-listener.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/codex-review-followups-1302-1316
          fetch-depth: 1
      - run: python scripts/move_stale_draft_listener.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: initialize create-page error state before stale listener"
          git push origin HEAD:repair/codex-review-followups-1302-1316
