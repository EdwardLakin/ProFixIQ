name: Mobile Command Validation

on:
  push:
    branches:
      - ui/mobile-command-refactor
  pull_request:
    paths:
      - "app/mobile/**"
      - "components/layout/MobileBottomNav.tsx"
      - "components/layout/MobileShell.tsx"
      - "features/mobile/**"
      - "features/shared/components/pwa/PwaRuntime.tsx"
      - "features/work-orders/mobile/**"
      - "tests/mobile-*.test.ts"
      - "tests/pwa-install-prompt-safe-area.test.ts"
      - ".github/workflows/mobile-command-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Lint changed TypeScript
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' \
            | tr '\n' '\0' \
            | xargs -0 --no-run-if-empty pnpm exec eslint

      - name: Mobile contract tests
        run: >-
          pnpm exec vitest run
          tests/mobile-native-route-audit.test.ts
          tests/mobile-route-continuity.test.ts
          tests/mobile-technician-first-ux.test.ts
          tests/mobile-technician-stabilization.test.ts
          tests/mobile-role-dashboard-layout.test.ts
          tests/mobile-remaining-role-dashboards.test.ts
          tests/mobile-global-menu-and-shift-scope.test.ts
          tests/pwa-install-prompt-safe-area.test.ts

      - name: Full test suite
        run: pnpm exec vitest run
