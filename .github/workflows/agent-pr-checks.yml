name: Agent PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: agent-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build full-app regression inventory
        id: regression_inventory
        continue-on-error: true
        run: pnpm regression:inventory:check --output-dir "$RUNNER_TEMP/regression-inventory"

      - name: Publish regression inventory summary
        if: always() && hashFiles('scripts/regression-inventory/critical-flows.json') != ''
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/regression-inventory/summary.md" ]]; then
            cat "$RUNNER_TEMP/regression-inventory/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload regression inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-app-regression-inventory
          path: ${{ runner.temp }}/regression-inventory
          if-no-files-found: warn

      - name: Type-check
        run: pnpm typecheck

      - name: Lint changed JavaScript and TypeScript files
        shell: bash
        run: |
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- \
              '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx'
          )
          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed JavaScript or TypeScript files."
            exit 0
          fi
          pnpm exec eslint "${changed_files[@]}"

      - name: Run complete test suite
        run: pnpm test

      - name: Build production application
        env:
          # Pull requests do not receive production secrets. These values only
          # let Next.js evaluate route modules while compiling; no network calls
          # are made and deploys still use environment-scoped credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder-service-role-key
          OPENAI_API_KEY: ci-build-placeholder-openai-key
          STRIPE_SECRET_KEY: sk_test_ci_build_placeholder
          NEXT_PUBLIC_SITE_URL: https://ci-build.example.test
        run: pnpm build

      - name: Enforce regression inventory gate
        if: always() && steps.regression_inventory.outcome == 'failure'
        run: |
          echo "Full-app regression inventory found new, expired, or stale findings."
          exit 1
