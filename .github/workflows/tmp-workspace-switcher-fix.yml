name: Temporary Workspace Switcher Fix
on:
  push:
    branches:
      - feature/workspace-product-switcher
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workspace-product-switcher
          fetch-depth: 0
      - run: python scripts/tmp_workspace_switcher_codex_fix.py
      - name: Commit fixes
        run: |
          rm scripts/tmp_workspace_switcher_codex_fix.py
          rm .github/workflows/tmp-workspace-switcher-fix.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix workspace switcher Codex findings'
          git push origin HEAD:feature/workspace-product-switcher
