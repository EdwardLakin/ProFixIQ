name: Supabase Clean Replay Validation

on:
  push:
    branches:
      - fix/supabase-clean-replay
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "tests/parts/*.runtime.sql"
      - "tests/parts/*.runtime.sh"
      - "tests/security/*.runtime.sql"
      - "tests/customers/*.runtime.sql"
      - "db/sql/schema.sql"
      - "features/shared/types/types/supabase.ts"
      - "package.json"
      - "scripts/generate-supabase-public-baseline.py"
      - "scripts/check-supabase-schema-contract.sh"
      - "scripts/verify-supabase-generated-types.sh"
      - "docs/supabase-recovery-and-schema-contract.md"
      - ".github/workflows/supabase-clean-replay-audit.yml"

permissions:
  contents: read

concurrency:
  group: supabase-clean-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.114.0
          github-token: ${{ github.token }}

      - name: Reject duplicate migration versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re

          versions: dict[str, list[str]] = defaultdict(list)
          invalid: list[str] = []

          for path in sorted(Path("supabase/migrations").glob("*.sql")):
              match = re.match(r"^(\d+)_", path.name)
              if match is None:
                  invalid.append(path.name)
                  continue
              versions[match.group(1)].append(path.name)

          duplicates = {
              version: names
              for version, names in versions.items()
              if len(names) > 1
          }

          if invalid or duplicates:
              if invalid:
                  print("Migration filenames without a numeric version prefix:")
                  for name in invalid:
                      print(f"  - {name}")
              if duplicates:
                  print("Duplicate Supabase migration versions:")
                  for version, names in sorted(duplicates.items()):
                      print(f"  {version}:")
                      for name in names:
                          print(f"    - {name}")
              raise SystemExit(1)
          PY

      - name: Verify the generated baseline is deterministic
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate-supabase-public-baseline.py
          git diff --exit-code -- \
            supabase/migrations/20260705000000_public_schema_baseline.sql

      - name: Initialize ephemeral Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f supabase/config.toml ]]; then
            supabase init
          fi
          supabase --version

      - name: Start a fresh local database and apply migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db start 2>&1 | tee supabase-db-start.log

      - name: Verify generated types match the applied migration contract
        shell: bash
        env:
          SUPABASE_GENERATED_TYPES_FILE: generated-supabase-types.ts
          SUPABASE_TYPES_DIFF_FILE: supabase-generated-types.diff
        run: bash scripts/verify-supabase-generated-types.sh --check

      - name: Reset and replay the full migration chain
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed --debug \
            2>&1 | tee supabase-db-reset.log

      - name: Execute parts lifecycle runtime integration
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
