name: Nightly Supabase Schema Contract

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * *"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-pr1817:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'marketing/funnel-measurement-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marketing/funnel-measurement-final
          fetch-depth: 0

      - name: Apply scoped review repair
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          route_path = Path('app/api/stripe/checkout/route.ts')
          route = route_path.read_text()
          old = '''      const successUrl = `${baseUrl}/auth/callback?flow=acquisition&session_id={CHECKOUT_SESSION_ID}&surface=${selection.acquisitionSurface}`;
      if (intent.status === "expired" || intent.status === "failed") {
        return noStoreJson({ error: "Checkout attempt expired" }, 409);
      }
      if (intent.checkoutSessionId) {
        const existing = await stripe.checkout.sessions.retrieve(
          intent.checkoutSessionId,
        );
        await recordCheckoutStarted();
        if (existing.status === "open" && existing.url) {
          return noStoreJson({
            ok: true,
            sessionId: existing.id,
            url: existing.url,
          });
        }
        if (existing.status === "complete") {
          return noStoreJson({
            ok: true,
            sessionId: existing.id,
            url: successUrl.replace("{CHECKOUT_SESSION_ID}", existing.id),
          });
        }
        return noStoreJson(
          { error: "Checkout attempt is no longer active" },
          409,
        );
      }
'''
          new = '''      const successUrl = `${baseUrl}/auth/callback?flow=acquisition&session_id={CHECKOUT_SESSION_ID}&surface=${selection.acquisitionSurface}`;
      if (intent.checkoutSessionId) {
        // The canonical acquisition ledger proves a real Checkout Session was
        // attached even if the intent has since expired. Reconcile analytics
        // before preserving the existing expired/inactive response behavior.
        await recordCheckoutStarted();
        if (intent.status === "expired" || intent.status === "failed") {
          return noStoreJson({ error: "Checkout attempt expired" }, 409);
        }

        const existing = await stripe.checkout.sessions.retrieve(
          intent.checkoutSessionId,
        );
        if (existing.status === "open" && existing.url) {
          return noStoreJson({
            ok: true,
            sessionId: existing.id,
            url: existing.url,
          });
        }
        if (existing.status === "complete") {
          return noStoreJson({
            ok: true,
            sessionId: existing.id,
            url: successUrl.replace("{CHECKOUT_SESSION_ID}", existing.id),
          });
        }
        return noStoreJson(
          { error: "Checkout attempt is no longer active" },
          409,
        );
      }
      if (intent.status === "expired" || intent.status === "failed") {
        return noStoreJson({ error: "Checkout attempt expired" }, 409);
      }
'''
          if route.count(old) != 1:
              raise SystemExit('expected checkout retry block exactly once')
          route_path.write_text(route.replace(old, new))

          helper_path = Path('features/analytics/server/checkout-started.ts')
          helper_path.write_text('''import "server-only";\n\nimport type { createAdminSupabase } from "@/features/shared/lib/supabase/server";\nimport type { ProductPackageKey } from "@/features/stripe/lib/stripe/product-packages";\n\ntype AdminClient = ReturnType<typeof createAdminSupabase>;\ntype MarketingCheckoutMode = "trial" | "paid";\ntype MarketingCheckoutInterval = "monthly" | null;\n\nconst MARKETING_PERSISTENCE_TIMEOUT_MS = 250;\n\nexport async function recordMarketingCheckoutStarted(input: {\n  admin: AdminClient;\n  checkoutAttemptId: string;\n  packageKey: ProductPackageKey | null;\n  interval: MarketingCheckoutInterval;\n  checkoutMode: MarketingCheckoutMode;\n}): Promise<void> {\n  let timeoutId: ReturnType<typeof setTimeout> | undefined;\n\n  try {\n    const result = await Promise.race([\n      input.admin.from("marketing_events").insert({\n        event_name: "checkout_started",\n        destination: "stripe_checkout",\n        package_key: input.packageKey,\n        interval: input.interval,\n        checkout_mode: input.checkoutMode,\n        checkout_attempt_id: input.checkoutAttemptId,\n      }),\n      new Promise<null>((resolve) => {\n        timeoutId = setTimeout(\n          () => resolve(null),\n          MARKETING_PERSISTENCE_TIMEOUT_MS,\n        );\n      }),\n    ]);\n\n    if (result === null) {\n      console.error("marketing_checkout_started_persistence_timed_out");\n      return;\n    }\n\n    const { error } = result;\n    if (!error || error.code === "23505") return;\n\n    console.error("marketing_checkout_started_persistence_failed", {\n      code: error.code ?? "unknown",\n    });\n  } catch (error) {\n    console.error("marketing_checkout_started_persistence_failed", {\n      message: error instanceof Error ? error.message : "unknown",\n    });\n  } finally {\n    if (timeoutId) clearTimeout(timeoutId);\n  }\n}\n''')

          test_path = Path('tests/marketing-funnel-measurement.test.ts')
          tests = test_path.read_text()
          old_test = '''  it("backfills checkout_started for every verified attached acquisition session before status branching", () => {
    const checkout = source("app/api/stripe/checkout/route.ts");
    const retryStart = checkout.indexOf("if (intent.checkoutSessionId) {");
    const retryEnd = checkout.indexOf("const metadata = acquisitionMetadata", retryStart);
    const retryBlock = checkout.slice(retryStart, retryEnd);
    const retrieveIndex = retryBlock.indexOf(
      "await stripe.checkout.sessions.retrieve(",
    );
    const recordIndex = retryBlock.indexOf("await recordCheckoutStarted();");
    const openIndex = retryBlock.indexOf('existing.status === "open"');
    const completeIndex = retryBlock.indexOf('existing.status === "complete"');
    const inactiveIndex = retryBlock.indexOf(
      "Checkout attempt is no longer active",
    );
    const retryRecords = retryBlock.match(/await recordCheckoutStarted\\(\\);/g) ?? [];

    expect(retryStart).toBeGreaterThan(-1);
    expect(retryEnd).toBeGreaterThan(retryStart);
    expect(retrieveIndex).toBeGreaterThan(-1);
    expect(recordIndex).toBeGreaterThan(retrieveIndex);
    expect(openIndex).toBeGreaterThan(recordIndex);
    expect(completeIndex).toBeGreaterThan(recordIndex);
    expect(inactiveIndex).toBeGreaterThan(recordIndex);
    expect(retryRecords).toHaveLength(1);
  });
'''
          new_test = '''  it("reconciles attached checkout_started before intent expiry can short-circuit", () => {
    const checkout = source("app/api/stripe/checkout/route.ts");
    const retryStart = checkout.indexOf("if (intent.checkoutSessionId) {");
    const retryEnd = checkout.indexOf("const metadata = acquisitionMetadata", retryStart);
    const retryBlock = checkout.slice(retryStart, retryEnd);
    const recordIndex = retryBlock.indexOf("await recordCheckoutStarted();");
    const firstStatusIndex = retryBlock.indexOf('intent.status === "expired"');
    const retrieveIndex = retryBlock.indexOf(
      "await stripe.checkout.sessions.retrieve(",
    );
    const openIndex = retryBlock.indexOf('existing.status === "open"');
    const completeIndex = retryBlock.indexOf('existing.status === "complete"');
    const inactiveIndex = retryBlock.indexOf(
      "Checkout attempt is no longer active",
    );
    const secondStatusIndex = retryBlock.indexOf(
      'intent.status === "expired"',
      firstStatusIndex + 1,
    );
    const retryRecords = retryBlock.match(/await recordCheckoutStarted\\(\\);/g) ?? [];

    expect(retryStart).toBeGreaterThan(-1);
    expect(retryEnd).toBeGreaterThan(retryStart);
    expect(recordIndex).toBeGreaterThan(-1);
    expect(firstStatusIndex).toBeGreaterThan(recordIndex);
    expect(retrieveIndex).toBeGreaterThan(firstStatusIndex);
    expect(openIndex).toBeGreaterThan(retrieveIndex);
    expect(completeIndex).toBeGreaterThan(retrieveIndex);
    expect(inactiveIndex).toBeGreaterThan(retrieveIndex);
    expect(secondStatusIndex).toBeGreaterThan(inactiveIndex);
    expect(retryRecords).toHaveLength(1);
  });

  it("strictly bounds checkout analytics persistence latency", () => {
    const helper = source("features/analytics/server/checkout-started.ts");

    expect(helper).toContain("MARKETING_PERSISTENCE_TIMEOUT_MS = 250");
    expect(helper).toContain("Promise.race([");
    expect(helper).toContain("setTimeout(");
    expect(helper).toContain("marketing_checkout_started_persistence_timed_out");
  });
'''
          if tests.count(old_test) != 1:
              raise SystemExit('expected checkout backfill regression exactly once')
          test_path.write_text(tests.replace(old_test, new_test))

          Path('.github/workflows/temporary-pr1817-review-repair.yml').unlink(missing_ok=True)
          Path('.github/workflows/main.yml').write_text('''name: Nightly Supabase Schema Contract\n\non:\n  workflow_dispatch: {}\n  schedule:\n    - cron: "0 7 * * *"\n\npermissions:\n  contents: read\n\njobs:\n  verify:\n    runs-on: ubuntu-latest\n    timeout-minutes: 35\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: supabase/setup-cli@v2\n        with:\n          version: 2.114.0\n          github-token: ${{ github.token }}\n\n      - name: Initialize ephemeral Supabase configuration\n        shell: bash\n        run: |\n          set -euo pipefail\n          if [[ ! -f supabase/config.toml ]]; then\n            supabase init\n          fi\n          supabase --version\n\n      - name: Replay migrations and verify generated types\n        shell: bash\n        run: bash scripts/check-supabase-schema-contract.sh --check\n''')
          PY

          git diff --check
          grep -q 'MARKETING_PERSISTENCE_TIMEOUT_MS = 250' features/analytics/server/checkout-started.ts
          grep -q 'grant insert on table public.marketing_events to service_role' supabase/migrations/20261007021000_create_marketing_events.sql

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "EdwardLakin"
          git config user.email "edwardlakin35@gmail.com"
          git add app/api/stripe/checkout/route.ts features/analytics/server/checkout-started.ts tests/marketing-funnel-measurement.test.ts .github/workflows/main.yml .github/workflows/temporary-pr1817-review-repair.yml
          git commit -m "Repair checkout analytics reconciliation"
          git push origin HEAD:marketing/funnel-measurement-final

  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.114.0
          github-token: ${{ github.token }}

      - name: Initialize ephemeral Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f supabase/config.toml ]]; then
            supabase init
          fi
          supabase --version

      - name: Replay migrations and verify generated types
        shell: bash
        run: bash scripts/check-supabase-schema-contract.sh --check
